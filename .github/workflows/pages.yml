# Publish the TypeDoc documentation to GitHub Pages:
# developer docs at https://unitn-asa.github.io/Deliveroo.js/ and SDK docs at /sdk/
# Requires Settings > Pages > Source: GitHub Actions

name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, without cancelling a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      # TypeDoc only reads the sources: native install scripts (e.g. canvas) are not needed
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build documentation
        run: |
          npx typedoc --options typedoc.pages.json --out _site
          npx typedoc --options packages/@unitn-asa/deliveroo-js-sdk/typedoc.sdk.json --out _site/sdk --hostedBaseUrl https://unitn-asa.github.io/Deliveroo.js/sdk/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
